name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: libraryforge_ci
          POSTGRES_USER: libraryforge
          POSTGRES_PASSWORD: libraryforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libraryforge -d libraryforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-not-a-production-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: libraryforge_ci
      POSTGRES_USER: libraryforge
      POSTGRES_PASSWORD: libraryforge_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      FFPROBE_PATH: ffprobe
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          working-directory: backend
          enable-cache: true

      - name: Synchronize backend dependencies
        run: uv sync --frozen --dev

      - name: Django system check
        run: uv run python manage.py check

      - name: Run backend tests
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
