name: Bug report
description: Report a reproducible LibraryForge defect.
title: "[Bug] "
labels:
  - "type: bug"
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LibraryForge. Please avoid including passwords,
        tokens, private URLs, or security-vulnerability details here.

        Security issues should follow SECURITY.md instead of this public form.

  - type: input
    id: version
    attributes:
      label: LibraryForge version
      description: Version and, if available, the Git commit shown by System Status.
      placeholder: "0.1.0-alpha.3 / abc1234"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Catalog / semantic matching
        - Canonical metadata
        - Artwork
        - Online video
        - Scanner / jobs
        - NFO
        - Files / storage
        - Projections / outputs
        - User settings / authentication
        - System / deployment
        - Frontend / UI
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and deployment type.
      placeholder: "Windows 11 dev / Debian LXC / Docker / macOS"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Scan ...
        3. Click ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials, tokens, private paths, and other sensitive data first.
      render: shell

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed passwords, tokens, credentials, and private information from this report.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
